<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Study Groups</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>

<div class="container">

    <h3>Study Groups</h3>
    <hr/>

    <a th:href="@{/addGroupForm}"
       class="btn btn-primary mb-3">
        Add Group
    </a>

    <table class="table table-bordered table-striped">

        <thead>
        <tr>
            <th>ID</th>
            <th>Group Name</th>
            <th>Faculty</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="group: ${groups}">
            <td th:text="${group.id}"></td>
            <td th:text="${group.groupName}"></td>
            <td th:text="${group.faculty}"></td>
            <td th:text="${group.course}"></td>
            <td>
                <a th:href="@{/showGroupUpdateForm(groupId=${group.id})}" class="btn btn-sm btn-primary">Update</a>
                <a th:href="@{/deleteGroup(groupId=${group.id})}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>

    </table>

    <hr/>
    <a th:href="@{/list}">Back to students</a>

</div>

</body>
</html>
